<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline Import Map Example</title>
<style>#controls {
  position: fixed;
  bottom: 20px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 10px;
  z-index: 10;
}

button {
  width: 50px;
  height: 50px;
  font-size: 24px;
}
#crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 10px;
  height: 10px;
  margin-left: -5px;
  margin-top: -5px;
  background-color: rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  z-index: 100;
  pointer-events: none; /* So it doesn't block interactions */
}
</style>
</head>
<body>
<div id="controls">
  <button id="forward">↑</button>
  <button id="left">←</button>
  <button id="right">→</button>
  <button id="backward">↓</button>
</div>
<!-- Crosshair element -->
<div id="crosshair"></div>
<script type="module" src="/main.js"></script>
</body>
</html>
